name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403
      # TUnit はテストプロジェクト自体が実行ファイル
      - run: dotnet run --project tests/InfisicalPushBridge.Tests.csproj
      - name: Helm lint
        run: helm lint charts/infisical-push-bridge
