name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # TUnit はテストプロジェクト自体が実行ファイル
      - run: dotnet run --project tests/InfisicalPushBridge.Tests.csproj
      - name: Helm lint
        run: helm lint charts/infisical-push-bridge
