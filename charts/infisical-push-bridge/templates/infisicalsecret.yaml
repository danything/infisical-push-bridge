{{- if .Values.infisicalSecret.enabled }}
# 署名キー自身も Infisical から引く（ブリッジが死んでいても operator のポーリングが運ぶ）
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  hostAPI: {{ .Values.infisicalSecret.hostAPI }}
  syncConfig:
    resyncInterval: 1m
  authentication:
    kubernetesAuth:
      identityId: {{ .Values.infisicalSecret.identityId }}
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: {{ .Values.infisicalSecret.serviceAccountName }}
        namespace: {{ .Values.infisicalSecret.serviceAccountNamespace }}
      secretsScope:
        projectSlug: {{ .Values.infisicalSecret.projectSlug }}
        envSlug: {{ .Values.infisicalSecret.envSlug }}
        secretsPath: {{ .Values.infisicalSecret.secretsPath }}
        recursive: false
  managedKubeSecretReferences:
    - secretName: {{ .Values.existingSecret }}
      secretNamespace: {{ .Release.Namespace }}
      creationPolicy: Orphan
{{- end }}
