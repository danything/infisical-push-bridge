apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # 署名キーがローテーションされたら自分も入れ替わる
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      containers:
        - name: bridge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - containerPort: 8080
          env:
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: webhook-secret
            {{- with .Values.provision }}
            {{- if .enabled }}
            - name: PROVISION_ENABLED
              value: "true"
            - name: INFISICAL_API_URL
              value: {{ required "provision.apiURL is required" .apiURL | quote }}
            - name: INFISICAL_PROJECT_ID
              value: {{ required "provision.projectId is required" .projectId | quote }}
            - name: INFISICAL_PROJECT_SLUG
              value: {{ required "provision.projectSlug is required" .projectSlug | quote }}
            - name: PROVISION_POLL_SECONDS
              value: {{ .pollSeconds | quote }}
            - name: PROVISION_RESYNC_SECONDS
              value: {{ .resyncSeconds | quote }}
            - name: INFISICAL_AUTH_METHOD
              value: {{ .auth.method | quote }}
            {{- if eq .auth.method "universal" }}
            - name: INFISICAL_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .auth.universalSecret | default $.Values.existingSecret }}
                  key: client-id
            - name: INFISICAL_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .auth.universalSecret | default $.Values.existingSecret }}
                  key: client-secret
            {{- else if eq .auth.method "kubernetes" }}
            - name: INFISICAL_IDENTITY_ID
              value: {{ required "provision.auth.identityId is required" .auth.identityId | quote }}
            {{- else }}
            {{- fail "provision.auth.method must be kubernetes or universal" }}
            {{- end }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
