image:
  repository: ghcr.io/danything/infisical-push-bridge
  # 省略時は Chart の appVersion（= ビルドしたコミット SHA）
  tag: ""

# Webhook の署名検証キー（Infisical の Webhook 設定に入れた secret key と同じ値）を
# 持つ Secret。キー名は webhook-secret。
existingSecret: infisical-push-bridge

# 署名キーの Secret 自体を Infisical から引く InfisicalSecret CR を一緒に作る場合。
# 無効なら existingSecret を別の手段で用意すること。
infisicalSecret:
  enabled: false
  hostAPI: ""            # 例: http://infisical.infisical.svc:8080/api
  identityId: ""
  serviceAccountName: ""      # Kubernetes 認証に使う SA
  serviceAccountNamespace: ""
  projectSlug: ""
  envSlug: prod
  secretsPath: ""        # 例: /infisical-push-bridge/infisical-push-bridge

# フォルダの自動作成と、ほかの値を引き継ぐ参照の自動投入(README「フォルダと参照の自動作成」)。
# 既定は無効。有効にするにはブリッジ専用の Infisical マシンアイデンティティが要る
# (operator の読み取り用アイデンティティとは別。README の手順で作る)。
provision:
  enabled: false
  apiURL: ""             # 例: http://infisical.infisical.svc:8080/api
  projectId: ""          # Infisical の API はプロジェクトを ID で受ける
  projectSlug: ""        # この slug を指す InfisicalSecret だけを扱う(ほかのプロジェクトは触らない)
  pollSeconds: 30        # InfisicalSecret の一覧を見る間隔(新しい CR・変わった CR を拾う)
  resyncSeconds: 600     # 全 CR をやり直す間隔(手で消したキーの補充や、失敗の再試行)
  auth:
    method: kubernetes   # kubernetes | universal
    # kubernetes: ブリッジ自身の ServiceAccount のトークンでログインする
    identityId: ""
    # Infisical は提示されたトークン自身で TokenReview を呼ぶ(Infisical 側に token reviewer JWT を
    # 置かない構成)。そのため SA に system:auth-delegator が要る。reviewer JWT を置いたなら false でよい
    authDelegator: true
    # universal: client-id / client-secret のキーを持つ Secret(省略時は existingSecret)
    universalSecret: ""

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    memory: 64Mi
